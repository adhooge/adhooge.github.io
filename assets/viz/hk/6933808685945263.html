<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Alignment Visualiser</title>
<style>
  :root { --beats:#39d6ff; --playhead:#ff3b5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0e1116; color:#e6e9ef;
         font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid #232a35; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; font-size:12px; color:#8b95a5; }
  .track { margin:18px; padding:14px; background:#151a21; border:1px solid #232a35;
           border-radius:10px; }
  .track h2 { margin:0 0 2px; font-size:15px; font-weight:600; }
  .meta { font-size:12px; color:#8b95a5; margin-bottom:10px; }
  .warn { font-size:12px; color:#ffcf6b; background:#3a2f14; border:1px solid #6b5518;
          border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .warn.hidden { display:none; }
  .specwrap { position:relative; width:100%; cursor:crosshair;
              background:#000; border-radius:6px; overflow:hidden; user-select:none; }
  .specwrap img { display:block; width:100%; height:auto; }
  .layer { position:absolute; top:0; left:0; width:100%; height:100%;
           pointer-events:none; }
  .beat { position:absolute; top:0; height:100%; width:0;
          border-left:1px solid; opacity:0.85; }
  .beat.beats { border-color:var(--beats); }
  .playhead { position:absolute; top:0; height:100%; width:0;
              border-left:2px solid var(--playhead); left:0;
              box-shadow:0 0 6px var(--playhead); }
  .ruler { position:relative; height:20px; margin-top:2px; font-size:10px;
           color:#8b95a5; }
  .ruler .tk { position:absolute; top:0; transform:translateX(-50%);
               border-left:1px solid #313a47; padding-left:0; height:6px; }
  .ruler .lb { position:absolute; top:6px; transform:translateX(-50%); white-space:nowrap; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
              margin-top:12px; font-size:13px; }
  .controls button { background:#222b38; color:#e6e9ef; border:1px solid #313a47;
                     border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .controls button:hover { background:#2c3848; }
  .controls button.play { background:#1f6feb; border-color:#1f6feb; }
  .ctl-group { display:flex; gap:6px; align-items:center; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:2px;
            vertical-align:middle; margin-right:4px; }
  .swatch.beats { background:var(--beats); }
  label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .time { font-variant-numeric:tabular-nums; color:#b9c2d0; min-width:140px; }
  input[type=range] { width:90px; vertical-align:middle; }
  .global { padding:0 20px 4px; font-size:12px; color:#8b95a5; }
</style>
</head>
<body>
<header>
  <h1>Beat Alignment Visualiser</h1>
  <p>Spectrogram + playback with the beat estimation.
     <span class="swatch beats"></span>mamba05 (<code>mamba05_alignment.refined</code>).
     Beat times are absolute; rendered relative to clip start.</p>
</header>
<div class="global">Tip: click a spectrogram to seek. Ticks are synthesised clicks at each beat.</div>
<div id="tracks"></div>

function b64ToBuf(b64){
  const bin = atob(b64); const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function fmt(t){

  const m=Math.floor(t/60), s=(t%60);
  return m+":"+s.toFixed(2).padStart(5,'0');
}

    this.startOffset = 0;    // position in buffer at that moment
    this.playing = false;
    this.tickNodes = [];
    this.showBeats = true;
    this.tickBeats = false;
    this.tickVol = 0.6;
    this.audioVol = 1.0;
    this.gain = actx.createGain();       // audio-only gain, ticks bypass it
    this.gain.gain.value = this.audioVol;
    this.gain.connect(actx.destination);
    this.build();
    this.decode();
  }

  build(){
    const t = this.t;
    const el = document.createElement('div'); el.className='track';
    el.innerHTML = `
      <h2>Beat Alignment</h2>
      <div class="meta">duration ${t.duration.toFixed(2)}s</div>
      <div class="warn hidden"></div>
      <div class="specwrap">
        <img src="data:image/png;base64,${t.spectrogram}">
        <div class="layer" data-layer="beats"></div>
        <div class="playhead"></div>
      </div>
      <div class="ruler"></div>
      <div class="controls">
        <button class="play">▶ Play</button>
        <button class="stop">■ Stop</button>
        <span class="time">0:00.00 / ${fmt(t.duration)}</span>
        <span class="ctl-group">
          <label>audio vol <input type="range" class="avol" min="0" max="1" step="0.05" value="1"></label>
        </span>
        <span class="ctl-group">
          <label><input type="checkbox" class="cb-sbeats" checked>
            <span class="swatch beats"></span>show beats</label>
        </span>
        <span class="ctl-group">
          <label><input type="checkbox" class="cb-tbeats">tick beats</label>
          <label>tick vol <input type="range" class="vol" min="0" max="1" step="0.05" value="0.6"></label>
        </span>
      </div>`;
    this.root.appendChild(el);
    this.el = el;
    this.wrap = el.querySelector('.specwrap');
    this.beatLayer = el.querySelector('[data-layer=beats]');
    this.playheadEl = el.querySelector('.playhead');
    this.rulerEl = el.querySelector('.ruler');
    this.timeEl = el.querySelector('.time');
    this.playBtn = el.querySelector('.play');
    this.warnEl = el.querySelector('.warn');

    this.drawBeats();
    this.drawRuler();
    this.drawWarning();

    this.playBtn.onclick = ()=> this.toggle();
    el.querySelector('.stop').onclick = ()=> this.stop();
    this.wrap.onclick = (e)=>{
      const r = this.wrap.getBoundingClientRect();
      const frac = (e.clientX - r.left)/r.width;
      this.seek(frac * this.t.duration);
    };
    el.querySelector('.cb-sbeats').onchange = (e)=>{ this.showBeats=e.target.checked; this.drawBeats(); };
    el.querySelector('.cb-tbeats').onchange = (e)=>{ this.tickBeats=e.target.checked; this.rescheduleTicks(); };
    el.querySelector('.avol').oninput = (e)=>{ this.audioVol=parseFloat(e.target.value); this.gain.gain.value=this.audioVol; };
    // Ticks are scheduled ahead of time, so re-schedule them to apply a new volume.
    el.querySelector('.vol').oninput = (e)=>{ this.tickVol=parseFloat(e.target.value); this.rescheduleTicks(); };
  }

  drawBeats(){
    const t=this.t, dur=t.duration;
    let html='';
    if (this.showBeats)
      for (const bt of t.beats){
        if (bt<0||bt>dur) continue;
        html += `<div class="beat beats" style="left:${(bt/dur*100)}%"></div>`;
      }
    this.beatLayer.innerHTML = html;
  }

  drawWarning(){
    const dur=this.t.duration, eps=1e-3;
    const out=this.t.beats.filter(bt => bt < -eps || bt > dur+eps);
    if (!out.length){ this.warnEl.classList.add('hidden'); return; }
    const list=out.map(b=>b.toFixed(2)+'s').join(', ');
    this.warnEl.classList.remove('hidden');
    this.warnEl.textContent =
      `⚠ ${out.length} beat${out.length>1?'s':''} outside the clip [0–${dur.toFixed(2)}s]: ${list}`;
  }

  drawRuler(){
    const dur=this.t.duration;
    // pick a ~nice step so we get ~8-12 labels
    const step = dur>20?5:(dur>10?2:1);
    let html='';
    for (let s=0;s<=dur+1e-6;s+=step){
      const frac=s/dur*100;
      html += `<div class="tk" style="left:${frac}%"></div>`;
      html += `<div class="lb" style="left:${frac}%">${s.toFixed(0)}s</div>`;
    }
    this.rulerEl.innerHTML=html;
  }

  async decode(){
    try {
      this.audioBuffer = await actx.decodeAudioData(b64ToBuf(this.t.audio));
    } catch(err){ console.error('decode failed', err); }
  }

  currentPos(){
    if (!this.playing) return this.startOffset;
    return this.startOffset + (actx.currentTime - this.startCtxTime);
  }

  toggle(){ this.playing ? this.pause() : this.play(); }

  play(){
    if (!this.audioBuffer) return;
    if (actx.state==='suspended') actx.resume();
    let offset = this.startOffset;
    if (offset >= this.audioBuffer.duration - 0.01) offset = 0;
    this.src = actx.createBufferSource();
    this.src.buffer = this.audioBuffer;
    this.src.connect(this.gain);
    this.startCtxTime = actx.currentTime;
    this.startOffset = offset;
    this.src.start(0, offset);
    this.src.onended = ()=>{ if (this.playing && this.currentPos()>=this.audioBuffer.duration-0.05) this.stop(); };
    this.playing = true;
    this.playBtn.textContent = '⏸ Pause';
    this.playBtn.classList.remove('play');
    this.scheduleTicks(offset);
    this.raf();
  }

  pause(){
    if (!this.playing) return;
    const pos = this.currentPos();
    this.stopNodes();
    this.startOffset = Math.min(pos, this.audioBuffer.duration);
    this.playing=false;
    this.playBtn.textContent='▶ Play';
    this.playBtn.classList.add('play');
  }

  stop(){
    this.stopNodes();
    this.playing=false; this.startOffset=0;
    this.playBtn.textContent='▶ Play';
    this.playBtn.classList.add('play');
    this.updatePlayhead(0);
  }

  stopNodes(){
    if (this.src){ try{this.src.onended=null; this.src.stop();}catch(e){} this.src=null; }
    this.clearTicks();
  }

  seek(pos){
    pos = Math.max(0, Math.min(pos, this.audioBuffer? this.audioBuffer.duration:this.t.duration));
    const wasPlaying = this.playing;
    this.stopNodes();
    this.startOffset = pos;
    if (wasPlaying){ this.playing=false; this.play(); }
    else this.updatePlayhead(pos);
  }

  // ---- tick synthesis ----
  clearTicks(){
    for (const n of this.tickNodes){ try{n.stop();}catch(e){} }
    this.tickNodes=[];
  }
  rescheduleTicks(){
    if (!this.playing) return;
    this.clearTicks();
    this.scheduleTicks(this.currentPos());
  }
  scheduleTicks(fromPos){
    if (!this.tickBeats) return;
    const base = this.startCtxTime - this.startOffset; // ctxTime that maps to buffer pos 0
    for (const bt of this.t.beats){
      if (bt < fromPos-0.001) continue;
      if (bt > this.audioBuffer.duration) continue;
      this.tick(base + bt, 1400);
    }
  }
  tick(when, freq){
    if (when < actx.currentTime) when = actx.currentTime;
    const osc=actx.createOscillator(), g=actx.createGain();
    osc.type='square'; osc.frequency.value=freq;
    const v=this.tickVol;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,v), when+0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, when+0.05);
    osc.connect(g); g.connect(actx.destination);
    osc.start(when); osc.stop(when+0.06);
    this.tickNodes.push(osc);
  }

  // ---- playhead loop ----
  raf(){
    if (!this.playing) return;
    const pos=this.currentPos();
    if (pos>=this.audioBuffer.duration){ this.stop(); return; }
    this.updatePlayhead(pos);
    requestAnimationFrame(()=>this.raf());
  }
  updatePlayhead(pos){
    const frac=pos/this.t.duration;
    this.playheadEl.style.left=(frac*100)+'%';
    this.timeEl.textContent=`${fmt(pos)} / ${fmt(this.t.duration)}`;
  }
}

const root=document.getElementById('tracks');
const player = new Player(TRACK, root);
</script>
</body>
</html>
