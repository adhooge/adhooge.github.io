services:
  jekyll:
    image: georgegca/multi-language-al-folio:v1.14.4
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle   # <-- persist gems
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle_cache: {}   # <-- declare the named volume

